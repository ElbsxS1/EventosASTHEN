# EventoBot — configuração

# Nome do mundo do evento. Coloque a pasta do mundo no servidor com este nome.
mundo-evento: "eventos"

# Mundo para onde os jogadores voltam quando o evento é fechado (/event off).
# Se esse mundo não estiver carregado, usa o mundo onde o aldeão está.
mundo-retorno: "lobby"

# Nome em cima do aldeão em cada estado. Aceita cores com &.
# {tempo} vira a contagem regressiva (ex.: 2h05m53s).
nome-fechado: "&c&lSem Evento"
nome-agendado: "&e&lEvento começa em &f&l{tempo}"
nome-aberto: "&a&lEvento Aberto"

mensagens:
  prefixo: "&8[&6Evento&8] "
  evento-fechado: "&cNão há evento no momento."
  evento-agendado: "&eO evento começa em &f{tempo}&e."
  evento-aberto: "&aO evento começou! Fale com o aldeão no lobby para entrar."
  evento-encerrado: "&eO evento foi encerrado. Você voltou ao lobby."

# ---------------------------------------------------------------- Evento de Natal
# Qual evento está ativo neste momento (só um por vez; Carnaval será independente).
evento-ativo: natal

natal:
  max-por-time: 4
  acertos-para-eliminar: 3
  min-jogadores-por-time: 1
  raio-preparacao: 3.0
  contagem-inicio: 5
  recarga-bolinha-ticks: 5
  bolinhas-por-pilha: 16
  ranking-top: 3
  holograma-top: 10
  # Comandos liberados para jogadores comuns dentro do evento (administradores são isentos).
  comandos-permitidos: [natal, lob, msg, tell, w, r, help]
